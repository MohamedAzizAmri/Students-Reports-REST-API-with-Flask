
services:
  api:
    build: .
    container_name: students-reports-api
    ports:
      - "${HOST_PORT:-5000}:${PORT:-5000}"      
    environment:
      PORT: ${PORT:-5000}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-before-deploying}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-5}
      REFRESH_TOKEN_HOURS: ${REFRESH_TOKEN_HOURS:-24}
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD:-admin123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /app/logs/app.log
    volumes:
      - ./logs:/app/logs                        
    restart: unless-stopped
